name: AI Maintenance Assistant
on:
  issue_comment:
    types: [created]
jobs:
  Assistant:
    uses: avioconsulting/shared-workflows/.github/workflows/ai-assistant.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
